name: Framework and PES tools
on: [push, pull_request, workflow_dispatch]
jobs:
  tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure without commercial inputs
        run: cmake -S . -B build -DPSPRECOMP_PROFILE=pes2013 -DPSPRECOMP_BUILD_TESTS=ON -DPSPRECOMP_MSVC_MP_JOBS=2
      - name: Build framework tests and PES generator
        run: cmake --build build --config Release --target psprecomp_tests pes2013_kernel_tests pes2013_umd_tests pes2013_lwmutex_tests pes2013_overlay_tests pes2013_mp3_tests pes2013_framebuffer_target_tests psp_analyze pes2013_recomp --parallel 2
      - name: Run framework tests
        run: ctest --test-dir build -C Release --output-on-failure
