plugins { id "com.android.application" }
android {
    namespace "com.psprecomp.pes2013"
    compileSdk 36
    defaultConfig {
        applicationId "com.psprecomp.pes2013"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.0.1-dev"
        ndk { abiFilters "arm64-v8a" }
    }
    // build_apk.ps1 builds and copies the native library before packaging.
    // Game inputs and AOT binaries are local artifacts, excluded from Git.
    packaging { jniLibs { useLegacyPackaging = true } }
}
